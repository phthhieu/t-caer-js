<!doctype html>
<html>
    <head>
        <title>T-Caer JS</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                display: flex;
                gap: 20px;
                padding: 20px;
                font-family: sans-serif;
                background: #f1f5f9;
                min-height: 100vh;
            }
            #render-output {
                flex: 1;
                background: white;
                border-radius: 8px;
                padding: 16px;
                box-shadow: 0 1px 3px rgba(0,0,0,.12);
            }
            #render-output h4 {
                font-size: 12px;
                color: #94a3b8;
                text-transform: uppercase;
                letter-spacing: .05em;
                margin-bottom: 12px;
            }
            #root {
                border: 1px dashed #e2e8f0;
                border-radius: 4px;
                padding: 12px;
                min-height: 60px;
            }
            #debug-panel {
                width: 300px;
                background: white;
                border-radius: 8px;
                padding: 16px;
                box-shadow: 0 1px 3px rgba(0,0,0,.12);
                align-self: flex-start;
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <div id="render-output">
            <h4>Rendered output</h4>
            <div id="root"></div>
        </div>
        <div id="debug-panel">Loading…</div>
        <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script type="text/babel" src="./main.js"></script>
    </body>
</html>
